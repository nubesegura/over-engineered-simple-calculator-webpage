name: CI

# Quality gates. Runs on every pull request of the gitflow branches and is reused by the
# deploy workflows, so nothing is applied unless the same checks pass on the pushed commit.
on:
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"
  TERRAFORM_VERSION: "1.16.2"
  TERRAGRUNT_VERSION: "1.1.5"

jobs:
  flutter:
    name: Flutter (analyze, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/calculator_app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Web
        run: flutter build web --release --no-web-resources-cdn

  auth-bff:
    name: Auth BFF (ruff, mypy, import-linter, pytest, pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/auth_bff
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/auth_bff/requirements-dev.txt

      - name: Install Dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Audit Dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements-dev.txt --no-deps --disable-pip --strict

      - name: Ruff Lint
        run: ruff check .

      - name: Ruff Format
        run: ruff format --check .

      - name: Mypy
        run: mypy src handler.py

      - name: Import Linter
        run: lint-imports

      - name: Test
        run: pytest

  iac:
    name: IaC (format and team standards)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup IaC Tooling
        uses: ./.github/actions/setup-iac
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive modules

      - name: Terragrunt HCL Format
        working-directory: environments
        run: terragrunt hcl fmt --check

      - name: Validate mandatory tags in root.hcl
        working-directory: environments
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          for key in team-owner project-name app-name repo-name env-type; do
            if ! grep -qE "^\s*\"$key\"\s*=" root.hcl; then
              echo "::error file=environments/root.hcl::Mandatory tag '$key' is missing from mandatory_tags"
              exit 1
            fi
          done
          if ! grep -qE "\"repo-name\"\s*=\s*\"$REPO_NAME\"" root.hcl; then
            echo "::error file=environments/root.hcl::Tag 'repo-name' does not match the repository name ($REPO_NAME)"
            exit 1
          fi
          echo "Mandatory tags present; repo-name = $REPO_NAME"

      - name: Validate S3 remote state
        working-directory: environments
        run: |
          if ! grep -qE '^\s*backend\s*=\s*"s3"' root.hcl; then
            echo "::error file=environments/root.hcl::The S3 remote_state backend is missing or commented out"
            exit 1
          fi
          echo "S3 remote state configured"

  terraform-validate:
    name: Terraform (validate, no credentials)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup IaC Tooling
        uses: ./.github/actions/setup-iac
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Validate Modules
        run: |
          set -euo pipefail
          for module in auth auth-bff; do
            echo "::group::terraform validate modules/$module"
            terraform -chdir="modules/$module" init -backend=false -input=false
            terraform -chdir="modules/$module" validate
            echo "::endgroup::"
          done

      # The frontend module declares the aws.us_east_1 alias, so it is validated through a
      # throwaway root in RUNNER_TEMP that passes both providers. No credentials are used:
      # validate never calls AWS.
      - name: Validate Frontend Module
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/validate-frontend"
          mkdir -p "$root"
          cat > "$root/main.tf" <<EOF
          provider "aws" {
            region = "eu-west-1"
          }

          provider "aws" {
            alias  = "us_east_1"
            region = "us-east-1"
          }

          module "frontend" {
            source = "$GITHUB_WORKSPACE/modules/frontend"
            providers = {
              aws           = aws
              aws.us_east_1 = aws.us_east_1
            }
            context                 = "validate"
            env_type                = "dev"
            domain_name             = "app.example.com"
            zone_id                 = "Z0000000000000000000"
            alert_email             = "ops@example.com"
            bff_function_name       = "validate"
            bff_function_url_domain = "abc123.lambda-url.us-east-2.on.aws"
          }
          EOF
          terraform -chdir="$root" init -backend=false -input=false
          terraform -chdir="$root" validate
