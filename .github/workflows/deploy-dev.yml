name: Deploy DEV

# Gitflow: every push to develop deploys dev with the tool named by the IAC_TOOL variable of the
# dev GitHub environment (default cloudformation; see deploy.yml).
on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
    secrets: inherit
