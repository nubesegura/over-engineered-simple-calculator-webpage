AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Auth BFF stack, SAM (twin of the Terraform unit edge/auth-bff, module modules/auth-bff): the backend for
  frontend Lambda function (code in src/auth_bff, built by sam build through src/auth_bff/Makefile), its
  function URL with AWS_IAM authorization, execution role and policy, log group, alert topic with email
  subscription and the Errors and Throttles alarms. No AutoPublishAlias and no versions. The CloudFront
  invoke permissions live in the frontend stack because they need the distribution ARN.

Parameters:
  EnvType:
    Type: String
    AllowedValues: [dev, prod]
    Description: Environment tier; last segment of every resource name
  Context:
    Type: String
    Default: oecalc
    AllowedPattern: "^[a-z0-9]+$"
    Description: Functional context of the project (naming convention segment)
  RegionCode:
    Type: String
    AllowedPattern: "^[a-z]+[0-9]+$"
    Description: Region of this stack without hyphens (useast2), naming convention segment
  DomainName:
    Type: String
    AllowedPattern: "^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$"
    Description: Public domain name of the web page; the BFF accepts only the origin https://<DomainName>
  AppClientId:
    Type: String
    AllowedPattern: "^[A-Za-z0-9]{1,128}$"
    Description: ID of the confidential app client (output AppClientId of the auth stack; not a secret)
  ClientSecretName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9/_+=.@-]{1,512}$"
    Description: Name of the Secrets Manager secret with the app client secret (output of the auth stack; a name, not the secret)
  ClientSecretArn:
    Type: String
    AllowedPattern: "^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$"
    Description: ARN of that secret (output of the auth stack); the only resource the role may read
  LogRetentionDays:
    Type: Number
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: Retention of the function log group in days (30 in dev, 365 in prod)
  TracingMode:
    Type: String
    AllowedValues: [Active, PassThrough]
    Description: X-Ray tracing mode of the function (Active in prod, LMB-07; PassThrough in dev)
  AlertEmail:
    Type: String
    NoEcho: true
    AllowedPattern: "^[^@ ]+@[^@ ]+$"
    Description: Email subscribed to the BFF alarms (GitHub secret SUPPORT_EMAIL)

Rules:
  ProdInvariants:
    RuleCondition: !Equals [!Ref EnvType, prod]
    Assertions:
      - Assert: !Equals [!Ref TracingMode, Active]
        AssertDescription: prod requires TracingMode Active (LMB-07)
      - Assert: !Equals [!Ref LogRetentionDays, "365"]
        AssertDescription: prod requires LogRetentionDays 365

Conditions:
  TracingActive: !Equals [!Ref TracingMode, Active]

Resources:
  # Created here so it has retention and tags (otherwise Lambda creates it without expiry). AWS managed
  # encryption: accepted gap G3 (CW-07).
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Accepted gap G3 (CW-07), same as Terraform; AWS managed encryption, no customer managed key
    Properties:
      LogGroupName: !Sub "/aws/lambda/fnc-${RegionCode}-${Context}-auth-bff-${EnvType}"
      RetentionInDays: !Ref LogRetentionDays

  # Same name as the Terraform module (iamr- prefix).
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "iamr-${RegionCode}-${Context}-auth-bff-${EnvType}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaAssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  # Own logs, the one client secret (the AWS managed key needs no kms statement), X-Ray only when tracing
  # is active (X-Ray writes do not support resource-level scoping). No ssm action.
  FunctionRolePolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: !Sub "iamp-${RegionCode}-${Context}-auth-bff-${EnvType}"
      RoleName: !Ref FunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # The Arn attribute of AWS::Logs::LogGroup already ends with ":*".
          - Sid: WriteOwnLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !GetAtt FunctionLogGroup.Arn
          - Sid: ReadClientSecret
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref ClientSecretArn
          - !If
            - TracingActive
            - Sid: WriteXRayTraces
              Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
            - !Ref "AWS::NoValue"

  # No runtime dependency: the python3.14 runtime provides boto3. The Makefile copies handler.py and the
  # .py files of src/auth_bff/src/auth_bff to the zip root, as the Terraform archive_file does.
  AuthBffFunction:
    Type: AWS::Serverless::Function
    DependsOn: FunctionRolePolicy
    Metadata:
      BuildMethod: makefile
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Owner decision ADR 0002, no reserved concurrency (same as Terraform); Throttles alarm instead
          - id: CKV_AWS_116
            comment: lambda.md (LMB-10 note, Accepted decisions) - a function invoked only synchronously through a function URL needs no dead-letter queue
          - id: CKV_AWS_117
            comment: lambda.md - Lambda.3 is intentionally not enforced; VPC only for private resources, this function calls public Cognito and Secrets Manager endpoints
          - id: CKV_AWS_173
            comment: lambda.md (LMB-09) - environment variables hold names and identifiers, never secrets; AWS managed encryption
    Properties:
      FunctionName: !Sub "fnc-${RegionCode}-${Context}-auth-bff-${EnvType}"
      Description: !Sub "Backend for frontend of the ${Context} page: login, refresh and logout against Cognito (${EnvType})"
      Role: !GetAtt FunctionRole.Arn
      CodeUri: ../src/auth_bff
      Runtime: python3.14
      Architectures: [arm64]
      Handler: handler.handler
      MemorySize: 256
      Timeout: 10
      # AWS_REGION is set by the runtime. No value is a secret: CLIENT_SECRET_ID is a name.
      Environment:
        Variables:
          COGNITO_APP_CLIENT_ID: !Ref AppClientId
          ALLOWED_ORIGIN: !Sub "https://${DomainName}"
          CLIENT_SECRET_ID: !Ref ClientSecretName
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref FunctionLogGroup
      Tracing: !Ref TracingMode

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AuthBffFunction.Arn
      AuthType: AWS_IAM

  # Alarms notify only a topic of their own region, so the BFF has its own topic in us-east-2.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_26
            comment: Accepted gap G8 (no customer managed key for SNS, owner decision 2026-10-04), same as Terraform
    Properties:
      TopicName: !Sub "sns-${RegionCode}-${Context}-auth-bff-alerts-${EnvType}"

  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Endpoint is create-only: a new SUPPORT_EMAIL replaces the subscription (refused by the change-set guard).
  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "alrm-${RegionCode}-${Context}-auth-bff-errors-${EnvType}"
      AlarmDescription: !Sub "The auth BFF function (${AuthBffFunction}) returned errors. Check the log group ${FunctionLogGroup}."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AuthBffFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  ThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "alrm-${RegionCode}-${Context}-auth-bff-throttles-${EnvType}"
      AlarmDescription: !Sub "The auth BFF function (${AuthBffFunction}) was throttled: the account concurrency is exhausted (a burst of requests or an attack)."
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref AuthBffFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

Outputs:
  FunctionName:
    Description: Name of the BFF function (target of the CloudFront permissions in the frontend stack)
    Value: !Ref AuthBffFunction
  FunctionArn:
    Description: ARN of the BFF function
    Value: !GetAtt AuthBffFunction.Arn
  FunctionUrlHost:
    Description: Host of the function URL, without scheme or path (second CloudFront origin)
    Value: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
  ErrorsAlarmArn:
    Description: ARN of the Errors alarm (prod-only RollbackConfiguration applied by the deploy script)
    Value: !GetAtt ErrorsAlarm.Arn
  AlertsTopicArn:
    Description: ARN of the BFF alert topic
    Value: !Ref AlertsTopic
