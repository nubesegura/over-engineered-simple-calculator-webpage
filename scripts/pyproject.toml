[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "S", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/*.py" = [
    "S603",  # the AWS and SAM CLIs are called with fixed argument lists, never through a shell
    "S607",  # the CLIs are resolved from PATH on the runner
]
"tests/**" = [
    "S101",  # pytest uses plain asserts
    "S105",  # fake tokens in fixtures
    "S106",
    "N803",  # fake clients mirror the boto3 keyword names (StackName, Bucket, ...)
]

[tool.ruff.lint.isort]
known-first-party = ["iac_common", "cfn_deploy", "iac_owner_guard", "iac_inventory", "post_destroy_check"]

[tool.mypy]
strict = true
ignore_missing_imports = true
mypy_path = "."

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=scripts --cov-config=scripts/pyproject.toml --cov-report=term-missing:skip-covered --cov-fail-under=85"

[tool.coverage.run]
omit = ["*/tests/*"]
